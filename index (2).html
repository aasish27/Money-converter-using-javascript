<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Currency Converter</title>
<style>
  body {
    background-color: #dff6ff;
    font-family: Comic Sans MS, Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
  }
  .box {
    background: #ffffff;
    border: 4px solid #333;
    border-radius: 15px;
    padding: 25px;
    width: 300px;
    box-shadow: 6px 6px 0px #333;
    text-align: center;
  }
  h1 {
    font-size: 22px;
    color: #ff5757;
    margin-bottom: 5px;
  }
  label {
    display: block;
    text-align: left;
    font-size: 14px;
    margin-top: 10px;
    margin-bottom: 3px;
    font-weight: bold;
  }
  input, select {
    width: 100%;
    padding: 8px;
    font-size: 14px;
    border: 2px solid #333;
    border-radius: 8px;
    box-sizing: border-box;
  }
  button {
    margin-top: 18px;
    width: 100%;
    padding: 10px;
    background-color: #ffde59;
    border: 3px solid #333;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
  }
  button:hover {
    background-color: #ffd000;
  }
  #result {
    margin-top: 15px;
    font-size: 16px;
    font-weight: bold;
    color: #007a3d;
    min-height: 20px;
  }
  .note {
    font-size: 10px;
    color: #999;
    margin-top: 10px;
  }
</style>
</head>
<body>

<div class="box">
  <h1>💱 Currency Converter</h1>

  <label for="amount">Enter amount</label>
  <input type="number" id="amount" placeholder="e.g. 100" value="1">

  <label for="from">From</label>
  <select id="from"></select>

  <label for="to">To</label>
  <select id="to"></select>

  <button onclick="convertMoney()">Convert</button>

  <div id="result"></div>

  <p class="note" id="statusNote">loading live rates...</p>
</div>

<!-- link to the external JavaScript file -->
<script src="script.js"></script>

</body>
</html>
